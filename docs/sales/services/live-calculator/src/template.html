function nitCalc(c){

    const y=Math.round(Math.min(100,Math.max(0,M*Math.log(Math.max(X,1))+C))*100)/100;
    const req=Math.ceil(Math.round(y/100*X*1e6)/1e6);
    const hires=y>=100?null:Math.max(0,Math.ceil(Math.round(((y/100*X-sa)/(1-y/100))*1e6)/1e6));
    return {code,y,req,carry:X-req,short:Math.max(0,req-sa),surplus:Math.max(0,sa-req),hires};});
  const pct=X>0?Math.round(sa/X*10000)/100:0;
  const cur=pct>=res[3].y?3:pct>=res[2].y?2:pct>=res[1].y?1:pct>=res[0].y?0:-1;

}
function profCalc(c){

}

function ddSearch(kind,q){const N=kind==='act'?ACTN:PROFN; const terms=norm(q).split(/\s+/).filter(Boolean); const out=[]; for(let i=0;i<N.length;i++){if(kind!=='act'&&!profInScope(i)) continue; let ok=true; for(const tm of terms){if(!N[i].includes(tm)){ok=false;break;}} if(ok) out.push(i);} 
  if(terms.length){const f=terms[0]; out.sort((a,b)=>((N[a].startsWith(f)||N[a].includes(' '+f))?0:1)-((N[b].startsWith(f)||N[b].includes(' '+f))?0:1));} return out;}

function viewHire(){
  const h=S.hire, n=S.nit, p=EP(h.prof);
  const sa0=n.full+0.5*n.part, X0=n.full+n.part+n.foreign;
  const isF=h.nat!=='saudi', q=Math.max(1,Math.round(h.qty));
  const X1=X0+q, sa1=sa0+(isF?0:q);
  const band=(sa,X)=>{const g=NIT[n.grp];const ys=BANDS.map(([code])=>{const v=g[code];return Math.min(100,Math.max(0,v[0]*Math.log(Math.max(X,1))+v[n.year-2026+1]));});
    const pct=X>0?sa/X*100:0;const i=pct>=ys[3]?3:pct>=ys[2]?2:pct>=ys[1]?1:pct>=ys[0]?0:-1;return {pct:Math.round(pct*100)/100,i,ys};};
  const b0=band(sa0,X0), b1=band(sa1,X1);
  const lbl=i=>i<0?tx('أحمر','Red'):tx(BANDS[i][2],BANDS[i][1]);
  const cls=i=>i>=2?'ok':i>=0?'warn':'bad';
  const only=p[1]==='Saudi-only', onReq=p[1]==='On request';
  const ratio=p[3]/100, minW=p[4], minS=p[5];
  const pt1=h.psaudi+h.pforeign+q, applies=pt1>=minW, reqP=applies?Math.ceil(Math.round(pt1*ratio*1e6)/1e6):0;
  const psa1=h.psaudi+(isF?0:q), shortP=Math.max(0,reqP-psa1);
  const hold=Math.max(0,Math.ceil(Math.round(b0.ys[Math.max(b0.i,0)]/100*X1*1e6)/1e6)-sa1);
  let verdict,vcls,why=[];
  if(isF&&only){verdict=tx('غير مسموح: المهنة للسعوديين فقط','Not allowed: Saudi-only profession');vcls='bad';why.push(tx('لا يُنقل إليها أجنبي. الحل: توظيف سعودي — ونعرض عليك «الكوادر الوطنية المشتركة».','No foreigner can be transferred in. Solution: a Saudi hire — ask about Shared National Talent.'));}
  else if(isF&&shortP>0){verdict=tx('مسموح لكن النسبة غير محققة','Allowed, but the ratio is not met');vcls='warn';why.push(tx(`نسبة توطين المهنة ${Math.round(ratio*100)}% تتطلب ${reqP} سعودياً في هذه المهنة وينقصك ${shortP}.`,`The ${Math.round(ratio*100)}% ratio needs ${reqP} Saudi(s) in this profession; you are short by ${shortP}.`));}
  else if(isF&&onReq){verdict=tx('يُدرس حسب الحالة','Assessed case by case');vcls='warn';why.push(tx('المهنة ضمن قرار توطين بلا تصنيف رسوم لدينا؛ نسعّرها عند الطلب.','Covered by a localisation decision with no fee class on our side; quoted on request.'));}
  else if(isF){verdict=tx('مسموح','Allowed');vcls='ok';}
  else {verdict=tx('توظيف سعودي يدعم التوطين','A Saudi hire supports localisation');vcls='ok';
    if(minS&&h.sal<minS){verdict=tx('سعودي لن يُحتسب: الراتب أقل من الحد الأدنى','Saudi will not count: salary below the minimum');vcls='bad';why.push(tx(`الحد الأدنى لأجر السعودي في هذه المهنة ${fmt(minS)} ريال.`,`Minimum Saudi salary in this profession is SAR ${fmt(minS)}.`));}}
  if(isF&&b1.i<b0.i) why.push(tx(`إضافة ${q} أجنبي تُنزل النطاق من ${lbl(b0.i)} إلى ${lbl(b1.i)}؛ تحتاج ${hold} سعودياً إضافياً للحفاظ عليه.`,`Adding ${q} foreigner(s) drops the band from ${lbl(b0.i)} to ${lbl(b1.i)}; you need ${hold} more Saudi(s) to hold it.`));
  const sc=!isF?saudiCalc(h.sal,h.term,h.prof):null;
  const lump=isF&&!only&&!onReq?lumpCalc({sal:h.sal,term:h.term,prof:h.prof,rec:recOf(h).cost,con:h.nat==='inside'?0:1000,tkt:h.nat==='inside'?0:2000,xfer:h.nat==='inside'?trnFee(h.trn):2000}):null;
  return `<div class="grid"><section class="panel"><h2>${tx('الموظف الجديد','The new hire')}</h2><p class="hint">${tx('أدخل وضع منشأتك ثم المهنة، وسنقول لك ما يُسمح به وأثره على النطاق وسعرنا.','Enter your establishment, then the profession; we show what is allowed, the effect on your band and our price.')}</p>
   ${fld('h-qty',tx('العدد','Quantity'),h.qty,{step:1,min:1})}
   ${pfld('h-prof',tx('المهنة','Profession'),h.prof)}
   <div class="row2">${fld('h-sal',tx('الراتب الشهري (ريال)','Monthly package (SAR)'),h.sal)}${fld('h-term',tx('مدة العقد','Contract term'),h.term,{list:termOptsF()})}</div>
   ${natFld('h-nat',h.nat,tx('الجنسية (حتى السعودي)','Nationality (Saudi too)'))}${isF?'':''}${(isF&&h.nat==='inside')?fld('h-trn',tx('رقم عملية نقل الكفالة','Sponsorship transfer no.'),h.trn,{list:[[0,tx('بدون نقل كفالة','No sponsorship transfer')],[1,tx('الأولى — 2,000','1st — 2,000')],[2,tx('الثانية — 4,000','2nd — 4,000')],[3,tx('الثالثة فأكثر — 6,000','3rd and above — 6,000')]]}):''}${(isF&&needsManual(h.nat))?fld('h-rec',tx('تكلفة الاستقدام الفعلية (ريال)','Recruitment cost, actual (SAR)'),h.rec):''}${sbFields(h.sal)}${insFields(isF)}
   <div class="row2">${fld('h-psaudi',tx('سعوديون حالياً في المهنة','Saudis now in this profession'),h.psaudi,{step:1})}${fld('h-pforeign',tx('أجانب حالياً في المهنة','Foreigners now in this profession'),h.pforeign,{step:1})}</div>
   <p class="hint">${tx('نشاط شركتك وأعدادها من خانة «شركتك» أعلاه.','Your company’s activity and headcount come from the “Your company” box above.')}</p></section>
  <section class="panel"><h2>${tx('الحكم','Verdict')}</h2><p><span class="pill ${vcls}" style="font-size:14px">${verdict}</span></p>
   ${why.map(w=>`<p style="margin:8px 0">${w}</p>`).join('')}
   <div class="res" style="margin-top:8px">
   ${line(tx('نسبة توطين المهنة','Profession ratio'),p[3]?Math.round(ratio*100)+'%':tx('لا نسبة','None'))}
   ${line(tx('أقل راتب يُحتسب للسعودي','Minimum salary counted for a Saudi'),minS?fmt(minS):tx('غير محدد','None stated'))}
   ${line(tx('نطاقك الآن','Your band now'),`<span class="pill ${cls(b0.i)}">${lbl(b0.i)} · ${fmt1(b0.pct)}%</span>`)}
   ${line(tx('نطاقك بعد التوظيف','Your band after the hire'),`<span class="pill ${cls(b1.i)}">${lbl(b1.i)} · ${fmt1(b1.pct)}%</span>`)}</div>
   ${lump?`<h2 style="margin-top:16px">${tx('سعرنا (مبلغ مقطوع)','Our price (lump sum)')}</h2><div class="res">${line(tx('السعر الشهري قبل الضريبة (شامل رسم التوطين)','Monthly price excl. VAT (incl. localisation fee)'),fmt(lump.withFee))}${line(tx('شامل الضريبة','Incl. VAT'),fmt(lump.incl),'total')}${line(tx('شهران مقدماً قبل الضريبة','Two months in advance, excl. VAT'),fmt(lump.adv2))}</div>`:''}
   ${sc?`<h2 style="margin-top:16px">${tx('سعرنا للسعودي (مسودة: تكلفة + '+S.fee.pct+'%)','Our price for a Saudi (draft: cost + 15%)')}</h2><div class="res">${line(tx('الباقة المضمونة','Guaranteed package'),fmt(sc.pkg))}${line(tx('إجمالي التكلفة الشهرية','Total monthly cost'),fmt(sc.cost))}${line(tx('السعر الشهري قبل الضريبة','Monthly price excl. VAT'),fmt(sc.price))}${line(tx('شامل الضريبة','Incl. VAT'),fmt(sc.incl),'total')}</div>`:''}${!isF?`<p class="hint" style="margin-top:12px">${tx('للتوظيف السعودي: خدمة «الكوادر الوطنية المشتركة» — تعاقد حقيقي بدوام جزئي أو مرن مع تدريب، وتسعيرها قيد الإعداد.','For a Saudi hire: the “Shared National Talent” service — a genuine part-time or flexible contract with training; pricing is being prepared.')}</p>`:''}

function otCalc(c){
  const basic=c.sal*S.sb.basic/100, hourly=basic/30/8;
  const mult=c.kind==='custom'?(parseFloat(c.custom)||0):parseFloat(c.kind);
  const rate=hourly*mult, cost=rate*c.hours;
  const fee=cost*S.fee.pct/100, vat=fee*0.15;
  return {basic,hourly,mult,rate,cost,fee,vat,total:cost+fee+vat,maxCap:c.sal};
}
function viewOt(){
  const c=S.lump, sv=S.extra; S.extra={...sv,otOn:'No',hours:8,days:6};
  let price=0; try{ const r=lumpCalc({...c,term:typeof c.term==='number'?c.term:12,rec:recOf(c).cost,con:c.nat==='inside'?0:c.con,tkt:c.nat==='inside'?0:c.tkt,xfer:c.nat==='inside'?trnFee(c.trn):2000}); price=r.fee==null?0:r.withFee; }finally{S.extra=sv;}
  const e=S.ot, hh=Math.max(8,sv.hours||8), perMonth=hh*dys(sv)*52/12, hourly=price/perMonth, rate=hourly*1.5, total=rate*(parseFloat(e.hours)||0);

/* ---------- render ---------- */
function summaryText(kind,extra){
  if(kind==='lump'){const r=lumpCalc(S.lump);return `${t('title')}\n${tx('المبلغ المقطوع','Lump sum')}: ${tx('راتب','salary')} ${fmt(S.lump.sal)} / ${S.lump.term} ${tx('شهراً','months')}\n${tx('السعر الشهري قبل الضريبة','Monthly price excl. VAT')}: ${fmt(r.withFee)}\n${tx('شامل الضريبة','Incl. VAT')}: ${fmt(r.incl)}\n${tx('شهران مقدماً (قبل الضريبة)','Two months advance (excl. VAT)')}: ${fmt(r.adv2)}`;}
  const r=costCalc(S.cost);return `${t('title')}\n${tx('تكلفة زائد','Cost plus')}: ${tx('راتب','salary')} ${fmt(S.cost.sal)} / ${S.cost.term} ${tx('شهراً','months')}\n${tx('الفاتورة الشهرية (متوسط)','Monthly invoice (avg)')}: ${fmt(r.inv)}\n${tx('الدفعة المقدمة','Advance payment')}: ${fmt(extra.advance)}`;
}
function wireCopy(kind,extra){
  const b=document.getElementById('copy-'+kind); if(!b) return;
  b.addEventListener('click',()=>{const txt=summaryText(kind,extra);const done=ok=>{const e=document.getElementById('copied'); if(e) e.textContent=ok?tx('تم النسخ.','Copied.'):tx('تعذّر النسخ — حدّد النص يدوياً.','Copy failed — select the text manually.'); if(!ok&&e){e.textContent+='\n'+txt;}};
    try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false));}catch(e){done(false);}});
}
const INIT_JSON=JSON.stringify({lump:S.lump,cost:S.cost,ins:S.ins,extra:S.extra,sb:S.sb,req:S.req,sa:S.sa});
const REQ_IDS={lump:[['l-term',()=>tx('مدة العقد','Contract term')],['l-src',()=>tx('مصدر العامل','Worker source')],['l-qty',()=>tx('عدد العمال','Headcount')],['i-gender',()=>tx('الجنس','Gender')],['l-sal',()=>tx('الراتب الإجمالي','Total salary')]],cost:[['c-term',()=>tx('مدة العقد','Contract term')],['c-src',()=>tx('مصدر العامل','Worker source')],['c-qty',()=>tx('عدد العمال','Headcount')],['i-gender',()=>tx('الجنس','Gender')],['c-sal',()=>tx('الراتب الإجمالي','Total salary')]]};
function missingFor(tab){const c=S[tab]; const m=REQ_IDS[tab].filter(([id])=>!S.touched[id]).map(([,l])=>l());
  if(S.touched[tab==='cost'?'c-sal':'l-sal']&&!(parseFloat(c.sal)>0)) m.push(tx('الراتب الإجمالي (أكبر من صفر)','Total salary (above zero)'));
  if(S.touched[tab==='cost'?'c-qty':'l-qty']&&!(parseInt(c.qty)>=1)) m.push(tx('عدد العمال (1 فأكثر)','Headcount (1 or more)'));
  const pf=tab==='cost'?'c':'l';
  if(c.src==='inside'&&!S.touched[pf+'-trn']) m.push(tx('رقم عملية نقل الكفالة','Sponsorship transfer no.'));
  if(c.src==='abroad'&&!S.touched[pf+'-cty']) m.push(tx('الجنسية','Nationality'));
  return [...new Set(m)];}
const readyTab=tab=>missingFor(tab).length===0;
function gate(html){
  if(!['lump','cost'].includes(S.tab)) return html; const c=S[S.tab]; if(typeof c.term!=='number') return html;
  const miss=missingFor(S.tab); if(!miss.length) return html;
  const i=html.indexOf('</section>'); if(i<0) return html;
  return html.slice(0,i)+`</section><section class="panel"><h2>${tx('السعر','Price')}</h2><p class="hint">${tx('أكمل الحقول التالية ليظهر السعر:','Fill in the following fields to see the price:')}</p><ul style="margin:6px 0 0;padding-inline-start:20px">${miss.map(x=>`<li>${x}</li>`).join('')}</ul></section></div>`;}
function resetForm(tab){S.step=S.step||{}; S.step[tab]=1; const d=JSON.parse(INIT_JSON); S[tab]=d[tab]; S.ins=d.ins; S.extra=d.extra; S.sb=d.sb; S.req=d.req;
  Object.keys(S.touched).forEach(k=>{if(BLANKRE.test(k)) delete S.touched[k];});}
function touchAllIds(){['l-term','l-src','l-cty','l-qty','l-sal','l-trn','l-con','l-rec','l-tkt','c-term','c-src','c-cty','c-qty','c-sal','c-trn','c-con','c-rec','c-arr','c-tkt1','c-exitv','c-freq','i-gender','i-cls','i-mat','x-hours','x-days','x-commOn','x-commPct','x-otOn','x-otHours','sb-basic','sb-housing','sb-transport','q-lic','q-exp','q-lang','q-langLvl','q-edu','q-skill','q-skillName','q-skillLvl'].forEach(k=>S.touched[k]=1);}
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const id=(e.target&&e.target.id||'').replace(/-s$/,''); if(BLANKRE.test(id)) S.touched[id]=1;},true));


const STEPS=[['العقد والمهنة','Contract & profession'],['العامل','The worker'],['العمل والتكاليف','Work & costs'],['الراتب والإضافات','Salary & extras']];
const stepOf=id=>/^(l|c)-(term|prof)/.test(id)?1:/^(l|c)-(src|cty|qty)|^i-gender/.test(id)?2:/^(x-hours|x-days|i-cls|i-mat)|^(l|c)-(trn|con|rec|tkt|arr|exitv|freq)/.test(id)?3:/^(l|c)-sal|^sb-|^x-(comm|ot)|^o-/.test(id)?4:0;
function stepify(){
 if(!['lump','cost'].includes(S.tab)) return;
 const sec=document.querySelector('#main .grid > section.panel'); if(!sec) return;
 let cur=0; const kids=[...sec.children], st=[];
 kids.forEach(k=>{const i=k.querySelector&&k.querySelector('input,select,textarea'); const id=(k.id||(i&&i.id)||''); const n=stepOf(id); if(n) cur=n; st.push(cur);});
 if(new Set(st.filter(Boolean)).size<3) return;
 const tab=S.tab; S.step=S.step||{}; let sc=S.step[tab]||1;
 const missIds=n=>REQ_IDS[tab].filter(([id])=>stepOf(id)===n&&!S.touched[id]).length
  +(n===2&&S[tab].src==='abroad'&&!S.touched[(tab==='cost'?'c':'l')+'-cty']?1:0)+(n===3&&S[tab].src==='inside'&&!S.touched[(tab==='cost'?'c':'l')+'-trn']?1:0);
 const okTo=n=>{for(let i=1;i<n;i++) if(missIds(i)) return false; return true;};
 if(!okTo(sc)) sc=[1,2,3,4].find(n=>!okTo(n+1))||1; S.step[tab]=sc;
 kids.forEach((k,i)=>{ if(st[i]&&st[i]!==sc) k.style.display='none'; });
 const first=kids.findIndex((k,i)=>st[i]>0), nav=document.createElement('div'); nav.className='stepper'; nav.setAttribute('role','tablist');
 nav.innerHTML=STEPS.map((x,i)=>`<button type="button" data-st="${i+1}" ${sc===i+1?'aria-current="step"':''} class="${i+1<sc&&!missIds(i+1)?'done':''}" ${okTo(i+1)?'':'disabled'}><b>${i+1}</b>${L==='ar'?x[0]:L==='en'?x[1]:trn(x[1])}</button>`).join('');
 sec.insertBefore(nav,kids[first]);
 const bar=document.createElement('div'); bar.className='stepnav';
 bar.innerHTML=`<button type="button" class="btn" data-go="-1" ${sc<=1?'disabled':''}>${tx('السابق','Back')}</button><button type="button" class="btn primary" data-go="1" ${sc>=4||missIds(sc)?'disabled':''}>${tx('التالي','Next')}</button>`;
 const lastIdx=st.lastIndexOf(sc); sec.insertBefore(bar,lastIdx>=0?kids[lastIdx].nextSibling:null);
 const go=n=>{S.step[tab]=Math.max(1,Math.min(4,n)); render(); const t=document.querySelector('.stepper'); if(t) t.scrollIntoView({block:'nearest'});};
 nav.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.st)));
 bar.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(sc+(+b.dataset.go))));
}
function cleanClient(){
 if(!CLIENT) return;
 const n=document.getElementById('t-notice'); if(n) n.style.display='none';
 const w=document.createTreeWalker(document.getElementById('app'),NodeFilter.SHOW_TEXT); const arr=[]; while(w.nextNode()) arr.push(w.currentNode);
 arr.forEach(x=>{let v=x.nodeValue,o=v;
  v=v.replace(/\s*[—-]\s*(للتأكيد|to confirm|à confirmer|待确认)/gi,'').replace(/\s*—\s*النسبة للتأكيد/g,'');
  v=v.replace(/(رسوم شركة بزنس بارتنر|Business Partner fee|Frais Business Partner|Business Partner 服务费)\s*\([^)]*\)/g,'$1');
  v=v.replace(/\(?\s*(النموذج الداخلي|internal model|مسودة|draft)\s*:?[^)]*\)?/gi,'');
  v=v.replace(/(مسودة|Draft)\s*:.*$/i,'');
  if(v!==o) x.nodeValue=v;});
 document.querySelectorAll('.pill.warn').forEach(e=>{if(/مسودة|Draft|بانتظار|await/i.test(e.textContent)) e.remove();});
}
function render(focusId){ try{ __render(focusId); stepify(); }finally{ cleanClient(); } }
function __render(focusId){
  $('#app').dir=L==='ar'?'rtl':'ltr'; $('#app').lang=L;
  $('#t-title').textContent=t('title'); $('#t-sub').textContent=t('sub'); $('#t-notice').textContent=t('notice'); $('#t-foot').textContent=t('foot');
  document.title=t('title');
  ['ar','en','fr','zh'].forEach(k=>$('#lang-'+k).setAttribute('aria-pressed',L===k));
  $('#tabs').innerHTML=Object.keys(T.tabs).map(k=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${L==='ar'?T.tabs[k][0]:(L==='en'?T.tabs[k][1]:trn(T.tabs[k][1]))}</button>`).join('');
  const views={lump:viewLump,cost:viewCost,nit:viewNit,prof:viewProf,hire:viewHire,team:viewTeam,ot:viewOt,rent:viewRent,guides:viewGuides};
  $('#main').innerHTML=(S.tab==='nit'?barHtml():['prof','hire','team','guides'].includes(S.tab)?compactBar():'')+gate(views[S.tab]())+(CLIENT?'':`<p style="margin-top:18px;text-align:center"><button class="btn" id="own" title="${tx('وضع المالك (للمعاينة فقط)','Owner mode (preview only)')}" style="font-size:11px;padding:2px 10px;opacity:${S.owner?1:.45}">⚙ ${S.owner?tx('إخفاء وضع المالك','Hide owner mode'):''}</button></p>`);
  if(!CLIENT) document.getElementById('own').addEventListener('click',()=>{S.owner=!S.owner;render();});
  const re=id=>render(id);
  document.querySelectorAll('[data-profall]').forEach(c=>c.addEventListener('change',()=>{S.profAll=c.checked;render();}));
  [['l','lump'],['c','cost']].forEach(([pp,tabk])=>{
    const g=S[tabk], sr=document.getElementById(pp+'-src'), ct=document.getElementById(pp+'-cty');
    if(sr) sr.addEventListener('change',()=>{g.src=sr.value; g.nat=deriveNat(g); if(g.src==='abroad') g.rec=defaultRec(g.cty); render();});
    if(ct) ct.addEventListener('change',()=>{g.cty=ct.value; g.nat=deriveNat(g); if(g.src==='abroad') g.rec=defaultRec(g.cty); render();});
  });
  const cT=document.getElementById('c-term'); if(cT) cT.addEventListener('change',()=>{const v=cT.value; if(/^u:/.test(v)){S.rent.unit=v.slice(2); S.lump.term=v; S.tab='lump'; render();} else {const n=parseInt(v,10); if(isFinite(n)){S.cost.term=n; render();}}});
  document.querySelectorAll('[data-gonit]').forEach(b=>b.addEventListener('click',()=>{S.tab='nit';render();}));
  ddClose(); wireCombos(); wireSelCombos(); wireSteppers(); wireChips();
  bind('nit',[['g-act','act','act'],['g-grp','grp','sel'],['g-year','year','int'],['g-full','full','num'],['g-part','part','num'],['g-foreign','foreign','num']],re);
  bind('rent',[['r-sal','sal','num']],re);
  S.order.forEach((row,i)=>{
    const on=(id,fn,ev)=>{const el=document.getElementById(id); if(el) el.addEventListener(ev||'change',fn);};
    on('o-qty-'+i,()=>{const v=parseInt(document.getElementById('o-qty-'+i).value,10); row.qty=isFinite(v)&&v>0?v:1; render('o-qty-'+i);},'input');
    on('o-n-'+i,()=>{const v=parseInt(document.getElementById('o-n-'+i).value,10); row.n=isFinite(v)&&v>0?v:1; render('o-n-'+i);},'input');
    on('o-gen-'+i,()=>{row.gender=document.getElementById('o-gen-'+i).value; render();});
    on('o-nat-'+i,()=>{row.nat=document.getElementById('o-nat-'+i).value; render();});
    on('o-trn-'+i,()=>{row.trn=parseInt(document.getElementById('o-trn-'+i).value,10)||0; render();});
    on('o-unit-'+i,()=>{row.unit=document.getElementById('o-unit-'+i).value; render();});
    on('o-fam-'+i,()=>{row.fam=document.getElementById('o-fam-'+i).value; row.code=''; render();});
    on('o-code-'+i,()=>{row.code=document.getElementById('o-code-'+i).value; render();});
    on('o-sal-'+i,()=>{const v=parseFloat(document.getElementById('o-sal-'+i).value); if(isFinite(v)&&v>=0&&row.code) S.salTable[row.code]=v; render('o-sal-'+i);},'input');
  });
  document.querySelectorAll('[data-osave]').forEach(b=>b.addEventListener('click',()=>{S.order[parseInt(b.dataset.osave,10)].saved=true;render();}));
  document.querySelectorAll('[data-oedit]').forEach(b=>b.addEventListener('click',()=>{S.order[parseInt(b.dataset.oedit,10)].saved=false;render();}));
  document.querySelectorAll('[data-odel]').forEach(b=>b.addEventListener('click',()=>{S.order.splice(parseInt(b.dataset.odel,10),1);render();}));
  document.querySelectorAll('[data-gact]').forEach(b=>b.addEventListener('click',()=>{
    const tab=S.tab==='cost'?'cost':'lump', c=S[tab]; if(typeof c.term!=='number') return;
    const act=b.dataset.gact, isNow=JSON.stringify(c)===S._last[tab]; if(!isNow&&!readyTab(tab)) return;
    if(!isNow){const total=simpleMode(c.term,()=>groupTotal(tab,c)); S.groups[tab].push({c:{...c},ins:{...S.ins},extra:{...S.extra},sb:{...S.sb},req:{...S.req},total});}
    S._last[tab]=JSON.stringify(c);
    if(act==='emp'||act==='grp'){resetForm(tab); S._last[tab]='';}
    render();}));
  document.querySelectorAll('[data-gedit]').forEach(b=>b.addEventListener('click',()=>{const [tab,i]=b.dataset.gedit.split(':'); const g=S.groups[tab].splice(parseInt(i,10),1)[0]; S[tab]={...g.c}; S.ins=g.ins; S.extra=g.extra; S.sb=g.sb; if(g.req) S.req=g.req; S._last[tab]=''; touchAllIds(); render();}));
  document.querySelectorAll('[data-gdel]').forEach(b=>b.addEventListener('click',()=>{const [tab,i]=b.dataset.gdel.split(':'); S.groups[tab].splice(parseInt(i,10),1); render();}));
  const oa=document.getElementById('o-add'); if(oa) oa.addEventListener('click',()=>{const lr=S.order[S.order.length-1]||{}; S.order.push({qty:1,gender:lr.gender||'male',nat:lr.nat||'IN',fam:lr.fam||'cons',code:'',unit:lr.unit||'day',n:lr.n||1,trn:lr.trn||0});render();});
  if(S.tab==='rent'||(S.tab==='lump'&&typeof S.lump.term==='string')){
    const lf=document.getElementById('lb-fam'); if(lf) lf.addEventListener('change',()=>{S.labor.fam=lf.value;S.labor.code='';render();});
    const lc2=document.getElementById('lb-code'); if(lc2) lc2.addEventListener('change',()=>{S.labor.code=lc2.value; const pi=PROF.findIndex(x=>x[7]===lc2.value); if(pi>=0) S.lump.prof=pi; if(S.salTable[lc2.value]) S.lump.sal=S.salTable[lc2.value]; render();});
    const ls=document.getElementById('lb-sal'); if(ls) ls.addEventListener('input',()=>{const v=parseFloat(ls.value); if(isFinite(v)&&v>=0&&S.labor.code){S.salTable[S.labor.code]=v;S.lump.sal=v;} render('lb-sal');});}
  if(S.tab==='lump'||S.tab==='rent'){bind('lump',[['l-sal','sal','num'],['l-qty','qty','int'],['l-term','term','term'],['l-prof','prof','prof'],['l-nat','nat','sel'],['l-trn','trn','int'],['l-rec','rec','num'],['l-con','con','num'],['l-tkt','tkt','num']],re);if(S.tab==='lump')wireCopy('lump');}
  if(S.tab==='cost'){bind('cost',[['c-sal','sal','num'],['c-qty','qty','int'],['c-prof','prof','prof'],['c-med','med','num'],['c-xfer','xfer','num'],['c-tkt1','tkt1','num'],['c-exitv','exitv','num'],['c-arr','arr','num'],['c-abroad','abroad','sel'],['c-nat','nat','sel'],['c-rec','rec','num'],['c-con','con','num'],['c-freq','freq','sel'],['c-trn','trn','int'],['c-saudi','saudi','sel'],['c-ssal','ssal','num'],['c-sinv','sinv','sel'],['c-sgosi','sgosi','num']],re);
    document.querySelectorAll('input[name=mode]').forEach(x=>x.addEventListener('change',()=>{S.cost.mode=x.value;render();}));
    const sc=schedCalc(S.cost); wireCopy('cost',{advance:S.cost.mode==='start'?sc.tot[0]:sc.grand});}
  if(S.tab==='nit') bind('nit',[['n-q','pq','txt'],['n-act','act','act'],['n-grp','grp','sel'],['n-year','year','int'],['n-target','target','sel'],['n-full','full','num'],['n-part','part','num'],['n-foreign','foreign','num']],re);
  if(S.tab==='hire') bind('hire',[['h-who','who','sel'],['h-nat','nat','sel'],['h-trn','trn','int'],['h-rec','rec','num'],['h-prof','prof','prof'],['h-qty','qty','num'],['h-sal','sal','num'],['h-term','term','int'],['h-psaudi','psaudi','num'],['h-pforeign','pforeign','num'],['h-q','__pq','txt'],['h-act','__act','act'],['h-grp','__grp','sel'],['h-year','__year','sel'],['h-full','__full','num'],['h-part','__part','num'],['h-foreign','__foreign','num']],re);

  if(S.tab==='team'){const c=S.team;
    bind('team',[['m-term','term','int'],['m-q','q','txt'],['m-cat','cat','sel']],re);
    c.rows.forEach((r,i)=>{
      const p=document.getElementById('m-p-'+i); p.addEventListener('change',()=>{const k=PROF.findIndex((x,k)=>profName(k)===p.value); if(k>=0){r.prof=k;render();}});
      ['s','f'].forEach(k=>{const e=document.getElementById('m-'+k+'-'+i); e.addEventListener('input',()=>{const v=parseFloat(e.value); r[k==='s'?'saudi':'foreign']=isFinite(v)&&v>=0?v:0; render(e.id);});});
      document.getElementById('m-d-'+i).addEventListener('click',()=>{c.rows.splice(i,1);render();});});
    document.getElementById('m-add').addEventListener('click',()=>{c.rows.push({prof:0,saudi:0,foreign:1});render();});
    document.querySelectorAll('[data-addp]').forEach(b=>b.addEventListener('click',()=>{c.rows.push({prof:parseInt(b.dataset.addp,10),saudi:0,foreign:1});render();}));}
  if(S.tab==='ot') bind('ot',[['ot-hours','hours','num']],re);
  if(S.tab==='guides') bind('guides',[['g-q','q','txt'],['g-oq','oq','txt']],re);
  bind('ins',[['i-gender','gender','sel'],['i-cls','cls','sel'],['i-mat','mat','sel']],re);
  bind('sb',[['sb-basic','basic','num'],['sb-housing','housing','num'],['sb-transport','transport','num']],re);
  bind('req',[['q-lic','lic','sel'],['q-exp','exp','sel'],['q-lang','lang','sel'],['q-langLvl','langLvl','sel'],['q-edu','edu','sel'],['q-skill','skill','sel'],['q-skillName','skillName','txt'],['q-skillLvl','skillLvl','sel']],re);
  bind('extra',[['x-hours','hours','num'],['x-days','days','int'],['x-commOn','commOn','sel'],['x-commPct','commPct','num'],['x-otOn','otOn','sel'],['x-otHours','otHours','num']],re);
  bind('fee',[['o-oh','overhead','num'],['o-pct','pct','num'],['o-p9','p9','num'],['o-p6','p6','num'],['o-p3','p3','num'],['o-pS','pS','num'],['o-loc','loc','sel']],re);
  bind('fbo',[['f-base','base','num']],re);
  bind('sa',[['s-share','share','num'],['s-trainOn','trainOn','sel'],['s-basic','basic','num'],['s-housing','housing','num'],['s-regime','regime','sel'],['s-period','period','sel'],['s-train','train','num']],re);
  if(S.tab==='prof') bind('prof',[['p-prof','prof','prof'],['p-saudi','saudi','num'],['p-foreign','foreign','num'],['p-term','term','int']],re);
  if(focusId){const e=document.getElementById(focusId); if(e){e.focus(); try{const ty=e.type; if(ty==='number'||ty==='search'||ty==='text'){e.type='text'; const n=e.value.length; e.setSelectionRange(n,n); e.type=ty;}}catch(_){}}}
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(b){S.tab=b.dataset.tab;render();}});
$('#lang-ar').addEventListener('click',()=>{L='ar';render();});
$('#lang-en').addEventListener('click',()=>{L='en';render();});
$('#lang-fr').addEventListener('click',()=>{L='fr';render();});
$('#lang-zh').addEventListener('click',()=>{L='zh';render();});
render();
})();
