    else{ one=l.one; need=c.foreign>0?l.need:0; rem=Math.max(0,Math.ceil(Math.round((need-eff)*1e6)/1e6)); full=need*one; feeM=rem*one; fee=c.foreign>0?feeM/c.foreign:0; } // رسم التوطين على النقص الفعلي فقط
  }
  return {p,ratio,minW,minS,tot,eff,sp,applies,req,carry:tot-req,short:Math.max(0,Math.ceil(Math.round((req-eff)*1e6)/1e6)),only,onReq:req2,fee,feeM,need,rem,one,full,waived:Math.max(0,full-(feeM||0))};
}

async function saveFile(name,data,mime){ // داخل عارض Claude عبر capability downloads، وخارجه برابط تنزيل عادي
  try{ if(window.claude&&claude.use){ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename:name,data}); return 'saved'; } } }catch(e){ if(e&&e.code==='declined') return 'declined'; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:mime||'text/plain'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); return 'saved'; }catch(e){ return 'fail'; }
}

function stagesOf(sc){
  const n=sc.n, nm=r=>L==='ar'?r.ar:(L==='en'?r.en:trn(r.en));
  const pick=(k)=>sc.rows.filter(r=>r.st===k&&r.kind==='cost'&&r.v.some(Boolean));
  const mk=(rows,val)=>{const rs=rows.map(r=>[nm(r),val(r)]).filter(x=>x[1]>0.5); const cost=rs.reduce((t,x)=>t+x[1],0); return {rows:rs,cost,tot:cost};};
  const s1=mk(pick(1),r=>r.v[0]);
  const s2=mk(pick(2),r=>r.v[0]); const s2v=sc.rows.find(r=>r.st===2&&r.kind==='vat'); s2.vat=s2v?s2v.v[0]:0; s2.tot=s2.cost+s2.vat;
  const dep={cost:2*sc.a,tot:2*sc.a};
  const mrows=sc.rows.filter(r=>r.st==='M'&&r.kind==='cost'&&r.v[Math.min(2,n)]>0&&!/راتب الموظف \(شهران/.test(r.ar)).map(r=>[nm(r),r.v[Math.min(2,n)]]);
  const sal=[[tx('راتب الموظف','Employee salary'),sc.a]].concat(mrows);
  const mcost=sal.reduce((t,x)=>t+x[1],0), mvat=(sc.ov+sc.locM-(sc.discM||0))*0.15;
  const m={rows:sal,cost:mcost,ov:sc.ov,loc:sc.locM,disc:sc.discM||0,vat:mvat,tot:mcost+sc.ov+sc.locM-(sc.discM||0)+mvat};
  const e=mk(sc.rows.filter(r=>r.st==='E'&&r.kind==='cost'&&r.v[n]>0),r=>r.v[n]);
  const optRow=sc.rows.find(r=>r.kind==='opt'); e.opt=optRow?[nm(optRow),optRow.v[n]]:null;
  return {s1,s2,dep,m,e};
}

function ddClose(){if(DD){DD.remove();DD=null;} DDI=-1;}
function ddSearch(kind,q){const N=kind==='act'?ACTN:PROFN; const terms=norm(q).split(/\s+/).filter(Boolean); const out=[]; for(let i=0;i<N.length;i++){if(kind!=='act'&&(i===0||!profInScope(i))) continue; let ok=true; for(const tm of terms){if(!N[i].includes(tm)){ok=false;break;}} if(ok) out.push(i);} 
  if(terms.length){const f=terms[0]; out.sort((a,b)=>((N[a].startsWith(f)||N[a].includes(' '+f))?0:1)-((N[b].startsWith(f)||N[b].includes(' '+f))?0:1));} return out;}
function hl(text,q){const terms=q.trim().split(/\s+/).filter(Boolean); if(!terms.length) return text; let r=text; terms.forEach(tm=>{const e=tm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); r=r.replace(new RegExp('('+e+')','gi'),'<mark>$1</mark>');}); return r;}
function ddRender(inp,kind,empty){const q=empty?'':inp.value; DDR=ddSearch(kind,q); const total=DDR.length; const shown=DDR.slice(0,60);

  const src=kind==='act'?ACT:PROF; const label=i=>kind==='act'?src[i][1]:profName(i).replace(/ \[\d+\]$/,''); const code=i=>kind==='act'?src[i][0]:(src[i][7]||'');
  DD.innerHTML=`<div class="hd">${total?tx(total.toLocaleString('en-US')+' نتيجة'+(total>60?' — يُعرض أول 60، اكتب أكثر لتضييق البحث':''),total.toLocaleString('en-US')+' results'+(total>60?' — showing 60, type more to narrow':'')):tx('لا نتائج — جرّب حرفاً آخر','No results — try another letter')}</div>`+shown.map((i,k)=>`<button type="button" class="it ${k===DDI?'on':''}" data-i="${i}"><span class="c">${code(i)}</span><span>${hl(label(i),q)}</span>${kind==='prof'?`<small style="margin-inline-start:auto;color:var(--muted);white-space:nowrap">${src[i][3]?src[i][3]+'%':''}${src[i][1]==='Saudi-only'?' · '+tx('للسعوديين','Saudi-only'):''}</small>`:''}</button>`).join('');

function wireCombos(){document.querySelectorAll('[data-combo]').forEach(inp=>{const kind=inp.dataset.combo; const id=inp.id;

    else if(id==='l-prof') S.lump.prof=i; else if(id==='c-prof') S.cost.prof=i; else if(id==='p-prof') S.prof.prof=i; else if(id==='h-prof') S.hire.prof=i; else {const m=id.match(/^m-p-(\d+)$/); if(m) S.team.rows[+m[1]].prof=i;}

function wireSelCombos(){document.querySelectorAll('select[data-sel]').forEach(sel=>{

}

function eosYears(a,b){ // الشهر 30 يوماً والسنة 360، ويُحتسب يوم النهاية

function compAnalyze(est){
  const n=est||S.nit, rows=est?(est.rows||[]):S.team.rows, sc=n.act?actOccSet(n.act):null;
  const items=rows.filter(r=>r.prof>0&&(r.saudi+r.foreign)>0).map(r=>{
    const x=profCalc({prof:r.prof,saudi:r.saudi,spart:r.spart,foreign:r.foreign,term:S.team.term}), code=PROF[r.prof][7]||'';
    const linked=!sc||(!!code&&sc.has(code)); let st='ok';
    if(x.only){ if(r.foreign>0) st='bad'; }
    else if(x.onReq) st='info';
    else if(x.p[1]!=='Standard'){ if(!x.applies) st='info'; else if(x.short>0) st='warn'; }
    const m=x.minS>0?x.minS:4000;
    return {r,x,code,linked,st,name:profShort(r.prof),m,one:saudiCost(m)};
  });
  const notes=[];
  items.forEach(it=>{const {x,r}=it;
    if(it.st==='bad') notes.push({sev:'bad',name:it.name,prob:tx('مهنة مقصورة على السعوديين وفيها '+r.foreign+' أجنبي (مخالفة).','Saudi-only profession with '+r.foreign+' foreign worker(s) (violation).'),fix:tx('توطين الوظيفة بسعودي، أو تعديل مهنة العامل في قوى إلى مهنة غير مقصورة إن كان عمله فعلاً مختلفاً.','Fill the job with a Saudi, or correct the worker’s profession in Qiwa if the real job is different.')});
    if(it.st==='warn') notes.push({sev:'warn',name:it.name,prob:tx('ناقص '+x.short+' سعودي لبلوغ نسبة '+Math.round(x.ratio*100)+'% (المطلوب '+x.req+' من '+x.tot+').','Short '+x.short+' Saudi(s) to reach '+Math.round(x.ratio*100)+'% ('+x.req+' required of '+x.tot+').'),fix:tx('توظيف '+x.short+' سعودي براتب لا يقل عن '+fmt(it.m)+' (تكلفة السعودي الواحد نحو '+fmt(it.one)+' شهرياً).','Hire '+x.short+' Saudi(s) at a salary of at least '+fmt(it.m)+' (about '+fmt(it.one)+' a month each).')});
    if(it.st==='info'&&x.onReq) notes.push({sev:'info',name:it.name,prob:tx('تُسعَّر وتُراجَع عند الطلب حسب قرار المهنة.','Handled on request under the profession’s decision.'),fix:tx('راجع شروط التوطين قبل التوظيف.','Check the localisation terms before hiring.')});
    if(it.st==='info'&&!x.onReq&&!x.applies) notes.push({sev:'info',name:it.name,prob:tx('عليها قرار توطين لكنه لا يسري الآن ('+x.tot+' عاملاً أقل من الحد '+x.minW+').','A localisation decision exists but does not apply yet ('+x.tot+' workers, threshold '+x.minW+').'),fix:tx('راقب المهنة عند زيادة العدد.','Watch the profession as headcount grows.')});
    if(!it.linked) notes.push({sev:'amber',name:it.name,prob:tx('ليست من مهن نشاطك حسب قوى.','Not among your activity’s professions in Qiwa.'),fix:tx('عدّل مهنة العامل في قوى إلى مهنة مرتبطة بالنشاط، أو أضف النشاط المناسب إلى سجل المنشأة.','Change the worker’s profession in Qiwa to one linked to the activity, or add the right activity to the establishment record.')});
  });
  const SEVR={bad:0,warn:1,amber:2,info:3}; notes.sort((u,v)=>SEVR[u.sev]-SEVR[v.sev]);
  const bad=items.filter(i=>i.st==='bad').length, shortT=items.reduce((t,i)=>t+(i.st==='warn'?i.x.short:0),0), unl=items.filter(i=>!i.linked).length;
  const costShort=items.reduce((t,i)=>t+(i.st==='warn'?i.x.short*i.one:0),0), costBad=items.reduce((t,i)=>t+(i.st==='bad'?i.r.foreign*i.one:0),0);
  const ok=items.filter(i=>i.st!=='bad'&&i.st!=='warn'&&i.linked).length, score=items.length?Math.round(ok/items.length*100):100;
  return {items,notes,bad,shortT,unl,costShort,costBad,score,sc};
}

function otCalc(c){
  const basic=c.sal*S.sb.basic/100, hourly=basic/30/8;
  const mult=c.kind==='custom'?(parseFloat(c.custom)||0):parseFloat(c.kind);
  const rate=hourly*mult, cost=rate*c.hours;
  const fee=cost*S.fee.pct/100, vat=fee*0.15;
  return {basic,hourly,mult,rate,cost,fee,vat,total:cost+fee+vat,maxCap:c.sal};
}

      const p=document.getElementById('m-p-'+i); p.addEventListener('change',()=>{const k=PROF.findIndex((x,k)=>profName(k)===p.value); if(k>=0){r.prof=k;render();}});
      ['s','sp','f'].forEach(k=>{const e=document.getElementById('m-'+k+'-'+i); e.addEventListener('input',()=>{const v=parseFloat(e.value); r[k==='s'?'saudi':k==='sp'?'spart':'foreign']=isFinite(v)&&v>=0?v:0; render(e.id);});});
      document.getElementById('m-d-'+i).addEventListener('click',()=>{c.rows.splice(i,1);render();});});
    document.getElementById('m-add').addEventListener('click',()=>{c.rows.push({prof:0,saudi:0,foreign:1});render();});
    document.querySelectorAll('[data-addp]').forEach(b=>b.addEventListener('click',()=>{c.rows.push({prof:parseInt(b.dataset.addp,10),saudi:0,foreign:1});render();}));}

  if(S.tab==='guides') bind('guides',[['g-q','q','txt'],['g-oq','oq','txt']],re);

  bind('extra',[['x-hours','hours','num'],['x-days','days','int'],['x-commOn','commOn','sel'],['x-commPct','commPct','num'],['x-otOn','otOn','sel'],['x-otHours','otHours','num']],re);
  bind('fee',[['o-oh','overhead','num'],['o-pct','pct','num'],['o-p9','p9','num'],['o-p6','p6','num'],['o-p3','p3','num'],['o-pS','pS','num'],['o-loc','loc','sel']],re);
  bind('fbo',[['f-base','base','num']],re);
  bind('sa',[['s-share','share','num'],['s-trainOn','trainOn','sel'],['s-basic','basic','num'],['s-housing','housing','num'],['s-regime','regime','sel'],['s-period','period','sel'],['s-train','train','num']],re);
  if(S.tab==='prof') bind('prof',[['p-prof','prof','prof'],['p-saudi','saudi','num'],['p-foreign','foreign','num'],['p-term','term','int']],re);
  if(focusId){const e=document.getElementById(focusId); if(e){e.focus(); try{const ty=e.type; if(ty==='number'||ty==='search'||ty==='text'){e.type='text'; const n=e.value.length; e.setSelectionRange(n,n); e.type=ty;}}catch(_){}}}
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(b){S.tab=b.dataset.tab;render();}});
$('#lang-ar').addEventListener('click',()=>{L='ar';render();});
