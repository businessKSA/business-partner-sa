<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>نشر وظيفة</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#333}.container{max-width:600px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:40px}h1{text-align:center;color:#667eea;font-size:28px;margin-bottom:10px}.form-group{margin-bottom:20px}label{display:block;margin-bottom:8px;font-weight:600;color:#333;font-size:14px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:inherit;font-size:14px}input:focus,textarea:focus{outline:0;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}textarea{min-height:120px}button{width:100%;padding:12px 20px;border:0;border-radius:6px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;margin-top:20px}button:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.3)}button:disabled{opacity:.6;cursor:not-allowed}.alert{padding:12px;border-radius:6px;margin-bottom:20px;background:#f8d7da;color:#721c24}.success-box{background:#f0f7ff;border:1px solid #667eea;padding:20px;border-radius:6px;text-align:center;display:none}.success-box.show{display:block}.link-box{background:#f5f5f5;padding:12px;border-radius:6px;margin:10px 0;word-break:break-all;font-family:monospace;font-size:12px}.copy-btn{padding:6px 12px;background:#667eea;color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:12px;margin-top:5px}</style></head><body><div class="container"><h1>نشر وظيفة</h1><div id="alertBox"></div><form id="jobForm"><div class="form-group"><label>عنوان الوظيفة *</label><input type="text" name="title" placeholder="مثال: طاهي" required></div><div class="form-group"><label>المدينة</label><input type="text" name="city" placeholder="الرياض" value="الرياض"></div><div class="form-group"><label>الوصف *</label><textarea name="description" placeholder="اشرح طبيعة العمل..." required></textarea></div><div class="form-group"><label>البريد الإلكتروني *</label><input type="email" name="employerEmail" placeholder="your@email.com" required></div><div class="form-group"><label>رقم الهاتف</label><input type="tel" name="employerPhone" placeholder="+966"></div><button type="submit">نشر</button></form><div id="successBox" class="success-box"><h3>✅ تم!</h3><p>شارك هذا الرابط:</p><div class="link-box" id="applyLink"></div><button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('applyLink').textContent).then(()=>alert('تم نسخ!'))">انسخ</button></div></div><script>document.getElementById('jobForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;const data=Object.fromEntries(new FormData(e.target));data.action='public-post-job';try{const r=await fetch('/api/candidates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!result.ok){document.getElementById('alertBox').innerHTML='<div class="alert">خطأ: '+result.error+'</div>';btn.disabled=false;return}document.getElementById('jobForm').style.display='none';document.getElementById('applyLink').textContent='https://businesspartner.sa'+result.applyLink;document.getElementById('successBox').classList.add('show')}catch(err){document.getElementById('alertBox').innerHTML='<div class="alert">خطأ: '+err.message+'</div>';btn.disabled=false}});</script></body></html>
