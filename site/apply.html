<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تقديم الطلب</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#333}.container{max-width:700px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:40px}h1{text-align:center;color:#667eea;font-size:28px}.job-info{background:#f0f7ff;padding:20px;border-radius:8px;border-left:4px solid #667eea;margin-bottom:30px}.form-group{margin-bottom:20px}label{display:block;margin-bottom:8px;font-weight:600;color:#333;font-size:14px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-family:inherit;font-size:14px}input:focus,textarea:focus{outline:0;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}textarea{min-height:100px}button{width:100%;padding:12px 20px;border:0;border-radius:6px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;margin-top:20px}button:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.3)}.alert{padding:12px;border-radius:6px;margin-bottom:20px;background:#f8d7da;color:#721c24}.success-message{background:#d4edda;color:#155724;padding:20px;border-radius:6px;text-align:center;display:none}.success-message.show{display:block}</style></head><body><div class="container"><h1>تقديم الطلب</h1><div id="alertBox"></div><div id="jobInfo" class="job-info" style="display:none"><div id="jobTitle"></div></div><form id="appForm"><div class="form-group"><label>الاسم *</label><input type="text" name="name" required></div><div class="form-group"><label>البريد *</label><input type="email" name="email" required></div><div class="form-group"><label>الهاتف *</label><input type="tel" name="phone" required></div><div class="form-group"><label>المدينة</label><input type="text" name="city" value="الرياض"></div><div class="form-group"><label>السيرة الذاتية *</label><textarea name="cv" required></textarea></div><button type="submit">إرسال</button></form><div id="success" class="success-message"><h3>✅ تم!</h3><p>شكراً! سيتم التواصل معك قريباً.</p></div></div><script>const jobId=new URLSearchParams(window.location.search).get('job');async function load(){if(!jobId)return;try{const r=await fetch(`/api/candidates?publicJob=${jobId}`);const result=await r.json();if(!result.ok)return;document.getElementById('jobTitle').textContent=result.posting.title+' - '+result.posting.city;document.getElementById('jobInfo').style.display='block'}catch(e){}}document.getElementById('appForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;const data=Object.fromEntries(new FormData(e.target));data.action='public-apply-job';data.jobId=jobId;data.cvText=data.cv;try{const r=await fetch('/api/candidates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!result.ok){document.getElementById('alertBox').innerHTML='<div class="alert">خطأ: '+result.error+'</div>';btn.disabled=false;return}document.getElementById('appForm').style.display='none';document.getElementById('success').classList.add('show')}catch(err){document.getElementById('alertBox').innerHTML='<div class="alert">خطأ</div>';btn.disabled=false}});load();</script></body></html>
