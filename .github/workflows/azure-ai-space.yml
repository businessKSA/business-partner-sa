# BP AI Command Space → Azure Static Web Apps.
#
# The Space used to be its own Vercel project, deployed by hand because
# config.js carries the unauthenticated n8n webhook paths and this repository
# is public. That Vercel project still exists behind Vercel Authentication
# (checked 2026-09-23 — an earlier note here claimed it was deleted; it was
# not). Azure is the target regardless: the grant pays for it, and Static Web
# Apps puts a real role check (`owner`) in front of a panel that can pause
# agents and create tasks, which team-level Vercel Auth does not.
#
# config.js is still never committed. It is written here from a secret, at
# deploy time, and only ever exists inside the runner.

name: Deploy AI Space to Azure

on:
  push:
    branches:
      - master
      - claude/intelligent-agents-collaboration-y788ck
    paths:
      - 'ai-space/**'
      - '.github/workflows/azure-ai-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-space-azure
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the deployment token gates the deploy now. config.js is no longer
      # secret: it carries timing options only (n8n paths and the Farah key live
      # in the Static Web App's application settings, read by ai-space/api).
      - id: gate
        name: Check Azure wiring
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Azure Static Web App not wired up yet (missing AZURE_STATIC_WEB_APPS_API_TOKEN) — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # config.js holds timing options only. The old AI_SPACE_CONFIG secret (which
      # carried webhook paths) is deliberately ignored: nothing secret may reach
      # the browser. Delete that secret once the app settings are in place.
      - name: Write runtime config
        if: steps.gate.outputs.ready == 'true'
        run: cp ai-space/config.example.js ai-space/config.js

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ai-space
          api_location: ai-space/api
          output_location: ''
          skip_app_build: true
          skip_api_build: true  # zero-dependency functions: nothing to build
