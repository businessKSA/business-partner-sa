name: Apply clean conversational homepage

on:
  push:
    branches:
      - claude/bpic-marketing-site-jvrnga
    paths:
      - .github/workflows/apply-home-clean.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bpic-marketing-site-jvrnga
      - name: Add homepage post-build steps
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('vercel.json')
          data = json.loads(p.read_text())
          cmd = data.get('buildCommand', '')
          for step in [
              'node site/scripts/home-clean-interface.mjs',
              'node site/scripts/home-chat-enhance.mjs'
          ]:
              if step not in cmd:
                  cmd += ' && ' + step
          data['buildCommand'] = cmd
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
      - name: Commit build configuration
        run: |
          if git diff --quiet -- vercel.json; then exit 0; fi
          git config user.name "businessKSA"
          git config user.email "business@businesspartnerksa.com"
          git add vercel.json
          git commit -m "Make homepage a single AI chat interface"
          git push origin HEAD:claude/bpic-marketing-site-jvrnga
