name: BP — Farah (Marketing & Content)
description: >-
  فرح، التسويق والمحتوى. سلّمها أي نص موجه لجمهور أو عميل: منشور، رسالة متابعة تسويقية،
  نص صفحة موقع، أو تجهيز أسبوع المحتوى من تقويم المحتوى في نوشن. تعيد نصًا جاهزًا بحالة Ready for Review.
  لا تنشر شيئًا بنفسها.
model:
  id: claude-sonnet-5
  effort: medium
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: true }
    configs:
      - name: bash
        enabled: false
      - name: web_fetch
        allowed_domains: [businesspartner.sa]
      - name: web_search
        user_location: { type: approximate, country: SA, timezone: Asia/Riyadh }
  - type: mcp_toolset
    mcp_server_name: notion
mcp_servers:
  - type: url
    name: notion
    url: https://mcp.notion.com/mcp
